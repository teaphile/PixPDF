name: CI

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pixpdf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run PDF and catalogue regression tests
        run: npm run test:pdf

      - name: Build production assets
        run: npm run build
